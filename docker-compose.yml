# Development compose (hot-reload + source bind-mount). For production use
# docker-compose.prod.yml. AutoScene has two Celery queues: `fast` (light
# orchestration) and `media` (image gen / FFmpeg render / assembly).
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  worker-fast:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app.celery_app worker -Q fast -c 10 --loglevel=info
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  worker-media:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app.celery_app worker -Q media -c 4 --loglevel=info
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
